name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        # Явно указываем derivedDataPath, чтобы знать точный путь к .app
        xcodebuild -project CertManager.xcodeproj \
          -scheme CertManager \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          build

    - name: Package to IPA
      run: |
        # Теперь путь точно известен и предсказуем
        APP_PATH="build/Build/Products/Release-iphoneos/CertManager.app"
        echo "Looking for app at: $APP_PATH"
        ls -la "$APP_PATH" # Для отладки: покажет содержимое, если путь верный
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r CertManager.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CertManager-IPA
        path: CertManager.ipa
