name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project CertManager.xcodeproj \
          -scheme CertManager \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          build

    - name: Inspect .app contents (Debug)
      run: |
        echo "=== Содержимое папки CertManager.app ==="
        ls -la build/Build/Products/Release-iphoneos/CertManager.app/

    - name: Package to IPA
      run: |
        APP_PATH="build/Build/Products/Release-iphoneos/CertManager.app"
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r CertManager.ipa Payload
        echo "=== Содержимое архива IPA ==="
        unzip -l CertManager.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CertManager-IPA
        path: CertManager.ipa
